name: Test download with MD5 verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get MD5 of target file
        id: get-md5
        run: |
          # Download the file independently to compute its MD5
          curl -sfL -o /tmp/probe-file.txt https://httpbin.org/robots.txt
          MD5=$(md5sum /tmp/probe-file.txt | awk '{print $1}')
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "Computed MD5: $MD5"
      - id: action
        uses: .
        with:
          file-url: https://httpbin.org/robots.txt
          file-name: robots-md5-verified.txt
          md5: ${{ steps.get-md5.outputs.md5 }}
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path output is set"
      - name: Assert downloaded file exists
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists and MD5 verification passed"
