name: Test download with MD5 verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Download a small, stable file and compute its MD5 first
      - name: Get MD5 of target file
        id: get-md5
        run: |
          curl -sL https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE -o /tmp/license-for-md5.txt
          MD5=$(md5sum /tmp/license-for-md5.txt | awk '{print $1}')
          echo "md5=$MD5" >> $GITHUB_OUTPUT
          echo "Computed MD5: $MD5"
      - id: action
        uses: .
        with:
          file-url: https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE
          file-name: license-md5-test.txt
          location: /tmp/md5-downloads
          md5: ${{ steps.get-md5.outputs.md5 }}
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path output is set"
      - name: Assert downloaded file exists
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file does not exist at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists at $FILE_PATH"
