name: Test download with MD5 hash verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Use a small, stable file with a known MD5 hash.
      # We download the file first to compute its MD5, then use the action with that hash.
      - name: Compute MD5 of target file
        id: compute-md5
        run: |
          curl -sL https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE -o /tmp/license-for-md5.txt
          MD5=$(md5sum /tmp/license-for-md5.txt | awk '{print $1}')
          echo "md5=$MD5" >> $GITHUB_OUTPUT
          echo "Computed MD5: $MD5"
      - id: action
        uses: .
        with:
          file-url: https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE
          file-name: license-md5-test.txt
          md5: ${{ steps.compute-md5.outputs.md5 }}
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path is set"
      - name: Assert downloaded file exists
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists and MD5 verification passed"
