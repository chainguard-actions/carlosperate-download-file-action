name: Test download with MD5 hash verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          file-url: https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE
          file-name: license.txt
          location: /tmp/downloads
          md5: 00000000000000000000000000000000
      - name: Assert action failed due to incorrect MD5
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with wrong MD5, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed MD5 verification"
