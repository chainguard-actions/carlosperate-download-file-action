name: Test basic download with file-url and file-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          file-url: https://raw.githubusercontent.com/actions/checkout/main/README.md
          file-name: downloaded-readme.md
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path is set to $FILE_PATH"
      - name: Assert downloaded file exists with correct name
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file not found at $FILE_PATH"
            exit 1
          fi
          BASENAME=$(basename "$FILE_PATH")
          if [ "$BASENAME" != "downloaded-readme.md" ]; then
            echo "FAIL: expected filename 'downloaded-readme.md', got '$BASENAME'"
            exit 1
          fi
          echo "PASS: file exists with correct name"
