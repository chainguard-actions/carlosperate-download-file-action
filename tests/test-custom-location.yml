name: Test download with custom location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local HTTP server
        run: |
          mkdir -p /tmp/serve
          echo "Custom location test content" > /tmp/serve/testfile.txt
          cd /tmp/serve && python3 -m http.server 8765 &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"
          sleep 1
          curl -sf http://localhost:8765/testfile.txt || (echo "Server not ready"; exit 1)
          echo "Local server started"
      - name: Create target directory
        run: mkdir -p downloads/subdir
      - id: action
        uses: .
        with:
          file-url: http://localhost:8765/testfile.txt
          location: downloads/subdir
      - name: Stop local HTTP server
        if: always()
        run: |
          kill "$HTTP_PID" 2>/dev/null || true
      - name: Assert file-path output contains location
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          if [[ "$FILE_PATH" != *"downloads/subdir"* ]]; then
            echo "FAIL: file-path does not contain expected location 'downloads/subdir'"
            exit 1
          fi
          echo "PASS: file-path contains expected location"
      - name: Assert file exists in specified location
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists in specified location"
      - name: Assert file is not empty
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          if [ ! -s "$FILE_PATH" ]; then
            echo "FAIL: downloaded file is empty"
            exit 1
          fi
          echo "PASS: file is non-empty"
