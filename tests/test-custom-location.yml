name: Test download to custom location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create download directory
        run: mkdir -p /tmp/download-test-dir
      - id: action
        uses: .
        with:
          file-url: 'https://raw.githubusercontent.com/carlosperate/download-file-action/master/README.md'
          file-name: 'readme.md'
          location: '/tmp/download-test-dir'
      - name: Assert file-path output points to custom location
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          DIRPART="$(dirname "$FILE_PATH")"
          echo "directory: $DIRPART"
          if [ "$DIRPART" != "/tmp/download-test-dir" ]; then
            echo "FAIL: expected directory '/tmp/download-test-dir' but got '$DIRPART'"
            exit 1
          fi
          echo "PASS: file is in the correct directory"
      - name: Assert file exists in custom location
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists at $FILE_PATH"
