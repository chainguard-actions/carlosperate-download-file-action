name: Test download with custom filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          file-url: 'https://raw.githubusercontent.com/carlosperate/download-file-action/master/README.md'
          file-name: 'my-custom-readme.md'
      - name: Assert file-path output contains custom filename
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          BASENAME="$(basename "$FILE_PATH")"
          echo "basename: $BASENAME"
          if [ "$BASENAME" != "my-custom-readme.md" ]; then
            echo "FAIL: expected filename 'my-custom-readme.md', got '$BASENAME'"
            exit 1
          fi
          echo "PASS: filename matches"
      - name: Assert renamed file exists on disk
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: renamed file does not exist at $FILE_PATH"
            exit 1
          fi
          echo "PASS: renamed file exists"
