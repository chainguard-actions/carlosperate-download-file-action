name: Test download with custom filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          file-url: https://httpbin.org/robots.txt
          file-name: my-custom-robots.txt
      - name: Assert file-path output contains custom filename
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          BASENAME="$(basename "$FILE_PATH")"
          echo "basename: $BASENAME"
          if [ "$BASENAME" != "my-custom-robots.txt" ]; then
            echo "FAIL: expected filename 'my-custom-robots.txt', got '$BASENAME'"
            exit 1
          fi
          echo "PASS: filename is correct"
      - name: Assert downloaded file exists with custom name
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists at $FILE_PATH"
