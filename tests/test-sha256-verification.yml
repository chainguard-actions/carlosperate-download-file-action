name: Test download with SHA256 verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Download a small, stable file and compute its SHA256 first
      - name: Get SHA256 of target file
        id: get-sha256
        run: |
          curl -sL https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE -o /tmp/license-for-sha256.txt
          SHA256=$(sha256sum /tmp/license-for-sha256.txt | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Computed SHA256: $SHA256"
      - id: action
        uses: .
        with:
          file-url: https://raw.githubusercontent.com/actions/checkout/de0fac2e4500dabe0009e67214ff5f5447ce83dd/LICENSE
          file-name: license-sha256-test.txt
          location: /tmp/sha256-downloads
          sha256: ${{ steps.get-sha256.outputs.sha256 }}
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path output is set"
      - name: Assert downloaded file exists
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file does not exist at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists at $FILE_PATH"
