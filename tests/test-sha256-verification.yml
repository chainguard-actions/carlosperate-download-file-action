name: Test download with SHA256 verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get SHA256 of target file
        id: get-sha256
        run: |
          # Download the file independently to compute its SHA256
          curl -sfL -o /tmp/probe-file.txt https://httpbin.org/robots.txt
          SHA=$(sha256sum /tmp/probe-file.txt | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: $SHA"
      - id: action
        uses: .
        with:
          file-url: https://httpbin.org/robots.txt
          file-name: robots-sha256-verified.txt
          sha256: ${{ steps.get-sha256.outputs.sha256 }}
      - name: Assert file-path output is set
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "file-path: $FILE_PATH"
          if [ -z "$FILE_PATH" ]; then
            echo "FAIL: file-path output is empty"
            exit 1
          fi
          echo "PASS: file-path output is set"
      - name: Assert downloaded file exists
        env:
          FILE_PATH: ${{ steps.action.outputs.file-path }}
        run: |
          echo "Checking file exists at: $FILE_PATH"
          if [ ! -f "$FILE_PATH" ]; then
            echo "FAIL: downloaded file not found at $FILE_PATH"
            exit 1
          fi
          echo "PASS: file exists and SHA256 verification passed"
